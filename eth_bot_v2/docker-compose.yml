version: "3.9"

services:

  eth-bot:

    container_name: eth-bot

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    volumes:
      - .:/app

    working_dir: /app

    stdin_open: true

    tty: true

    ports:
      - "8000:8000"
      - "8888:8888"

    environment:
      PYTHONUNBUFFERED: 1

    command: python -m llm.lstm.unittests.training.test_trainer