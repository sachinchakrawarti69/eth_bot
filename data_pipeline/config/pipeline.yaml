# ============================================================
# ETH Bot - Data Pipeline Configuration
# ============================================================

pipeline:

  name: "ETH Futures Data Pipeline"

  version: "1.0.0"

  environment: "development"

  enabled: true


# ============================================================
# General
# ============================================================

general:

  timezone: "UTC"

  symbol: "ETHUSDT"

  market: "futures"

  quote_asset: "USDT"

  base_asset: "ETH"

  auto_start: true

  retry_attempts: 5

  retry_delay_seconds: 5

  shutdown_timeout_seconds: 30


# ============================================================
# Data Collection
# ============================================================

collection:

  realtime: true

  historical: true

  websocket: true

  rest_api: true

  backfill_missing_data: true

  max_parallel_collectors: 10


# ============================================================
# Timeframes
# ============================================================

timeframes:

  - 1m
  - 3m
  - 5m
  - 15m
  - 30m
  - 1h
  - 2h
  - 4h
  - 6h
  - 8h
  - 12h
  - 1d


# ============================================================
# Data Types
# ============================================================

data_types:

  ohlcv: true

  trades: true

  orderbook: true

  funding_rate: true

  open_interest: true

  liquidations: true

  long_short_ratio: true

  mark_price: true

  index_price: true

  option_chain: true

  greeks: true

  implied_volatility: true

  fear_greed: true

  whales: true

  news: true

  onchain: true


# ============================================================
# Validation
# ============================================================

validation:

  enabled: true

  schema_validation: true

  missing_value_check: true

  duplicate_check: true

  timestamp_validation: true

  anomaly_detection: true

  quality_score_threshold: 95


# ============================================================
# Preprocessing
# ============================================================

preprocessing:

  enabled: true

  remove_duplicates: true

  fill_missing_values: false

  normalize: false

  align_timeframes: true

  resample: false

  remove_outliers: false


# ============================================================
# Technical Indicators
# ============================================================

technical_indicators:

  enabled: true

  auto_generate: true

  overwrite_existing: false


# ============================================================
# Feature Engineering
# ============================================================

feature_engineering:

  enabled: true

  auto_generate: true

  save_features: true

  feature_versioning: true


# ============================================================
# Dataset Builder
# ============================================================

dataset_builder:

  enabled: true

  create_training_dataset: true

  create_validation_dataset: true

  create_test_dataset: true

  shuffle: false

  random_seed: 42


# ============================================================
# Storage
# ============================================================

storage:

  save_raw: true

  save_processed: true

  save_features: true

  save_datasets: true

  compress_archives: true


# ============================================================
# Scheduler
# ============================================================

scheduler:

  enabled: true

  startup_job: true

  realtime_interval_seconds: 1

  health_check_interval_seconds: 60

  cleanup_interval_hours: 24


# ============================================================
# Logging
# ============================================================

logging:

  enabled: true

  level: INFO

  save_to_file: true

  console_output: true

  rotate_logs: true

  max_log_size_mb: 100

  backup_count: 10


# ============================================================
# Monitoring
# ============================================================

monitoring:

  enabled: true

  collect_metrics: true

  health_checks: true

  latency_tracking: true

  data_freshness_check: true

  alert_on_failure: true


# ============================================================
# Performance
# ============================================================

performance:

  multiprocessing: true

  worker_threads: 8

  batch_size: 1000

  cache_enabled: true

  cache_size_mb: 512


# ============================================================
# Development
# ============================================================

development:

  debug: false

  profiling: false

  dry_run: false

  save_intermediate_files: false

  verbose: false